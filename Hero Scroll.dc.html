<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;background:#FAF6EE;-webkit-font-smoothing:antialiased}a{color:#6F7D2B;text-decoration:none}a:hover{color:#A8703A}@keyframes hbc-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}</style>
</helmet>

<div style="font-family:'Manrope',sans-serif;color:#23261A;background:#FAF6EE">

<section ref="{{ trackRef }}" style="position:relative;height:560vh">
<div style="position:sticky;top:0;height:100vh;padding:14px;box-sizing:border-box">
<div style="position:relative;height:100%;border-radius:28px;overflow:hidden;background:#1C1F14;color:#FAF6EE;isolation:isolate">

<div ref="{{ glowRef }}" style="position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 45%,#8E9E4F 0%,rgba(28,31,20,0) 70%);opacity:.75"></div>
<div style="position:absolute;inset:0;background:radial-gradient(80% 100% at 50% 0%,rgba(58,66,24,.6) 0%,rgba(28,31,20,0) 70%)"></div>
<div style="position:absolute;inset:0;opacity:.13;background-image:radial-gradient(#CDD7B1 1.2px,transparent 1.5px);background-size:24px 24px"></div>

<sc-for list="{{ items }}" as="p" hint-placeholder-count="5">
<div ref="{{ p.wordRef }}" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;will-change:transform,opacity;opacity:{{ p.initOp }}">
<div style="font-family:'Bebas Neue',sans-serif;font-size:min(23vw,40vh);line-height:.8;white-space:nowrap;color:transparent;-webkit-text-stroke:2px {{ p.stroke }}">{{ p.word }}</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:min(23vw,40vh);line-height:.8;white-space:nowrap;color:{{ p.solid }}">{{ p.word }}</div>
</div>
</sc-for>

<sc-for list="{{ items }}" as="p" hint-placeholder-count="5">
<div ref="{{ p.prodRef }}" style="position:absolute;left:50%;top:calc(50% - 56px);width:min(calc(100vh - 300px),34vw,600px);aspect-ratio:1;transform:translate(-50%,-50%);will-change:transform,opacity,filter;opacity:{{ p.initOp }}">
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
{{ p.imgEl }}
</div>
</div>
</sc-for>

<div style="position:absolute;z-index:200;left:clamp(24px,5vw,72px);top:clamp(24px,6vh,64px);width:min(380px,calc(50% - 17vw - 56px));height:180px">
<sc-for list="{{ items }}" as="p" hint-placeholder-count="5">
<div ref="{{ p.copyRef }}" style="position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;will-change:transform,opacity;opacity:{{ p.initOp }}">
<div style="font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#CDD7B1">{{ p.eyebrow }}</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,3.2vw,46px);line-height:.95">{{ p.tagline }}</div>
<div style="font-size:15px;line-height:1.55;color:#E4E2D0">{{ p.desc }}</div>
</div>
</sc-for>
</div>

<div style="position:absolute;right:clamp(24px,5vw,72px);top:clamp(24px,6vh,64px);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
<span style="border:1px solid rgba(250,246,238,.3);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700">Lab tested</span>
<span style="border:1px solid rgba(250,246,238,.3);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700">Farm Bill legal</span>
<span style="border:1px solid rgba(250,246,238,.3);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700">Alcohol-free</span>
</div>

<div style="position:absolute;right:clamp(14px,2.4vw,32px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;align-items:center">
<sc-for list="{{ items }}" as="p" hint-placeholder-count="5">
<button onClick="{{ p.go }}" title="{{ p.name }}" style="cursor:pointer;border:none;padding:0;background:transparent;width:22px;height:22px;display:flex;align-items:center;justify-content:center"><span ref="{{ p.dotRef }}" style="display:block;width:8px;height:8px;border-radius:999px;background:#FAF6EE;opacity:.35;transition:height .4s cubic-bezier(.22,1,.36,1),opacity .4s,background .4s"></span></button>
</sc-for>
</div>

<div style="position:absolute;z-index:200;left:clamp(24px,5vw,72px);right:clamp(100px,8.5vw,124px);bottom:clamp(24px,5vh,52px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
<div style="position:relative;min-width:300px;height:96px;flex:1">
<sc-for list="{{ items }}" as="p" hint-placeholder-count="5">
<div ref="{{ p.infoRef }}" style="position:absolute;left:0;bottom:0;display:flex;flex-direction:column;gap:4px;padding:12px 18px;border-radius:18px;background:rgba(28,31,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(250,246,238,.14);will-change:transform,opacity;opacity:{{ p.initOp }}">
<div style="display:flex;gap:12px;align-items:baseline"><span style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#C8935A;letter-spacing:.06em;white-space:nowrap">{{ p.num }}</span><span style="font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,2.6vw,40px);line-height:1;white-space:nowrap">{{ p.name }}</span></div>
<div style="display:flex;gap:12px;align-items:baseline;font-size:15px;color:#CDD7B1"><span style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:#FAF6EE">{{ p.price }}</span><span style="text-decoration:line-through;opacity:.7">{{ p.was }}</span><span>{{ p.detail }}</span></div>
</div>
</sc-for>
</div>
<div style="display:flex;gap:12px">
<a href="#" style="display:flex;align-items:center;border:1.5px solid #FAF6EE;color:#FAF6EE;font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.06em;padding:0 26px;height:58px;border-radius:999px" style-hover="background:#FAF6EE;color:#23261A">Quick view</a>
<button onClick="{{ addCurrent }}" style="cursor:pointer;border:none;display:flex;gap:10px;align-items:center;background:#C8935A;color:#23261A;font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.06em;padding:0 26px;height:58px;border-radius:999px" style-hover="background:#D9A772"><span style="width:20px;height:20px;display:inline-block;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/shopping-cart.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/shopping-cart.svg) center/contain no-repeat"></span>{{ addLabel }}</button>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(250,246,238,.12)"><div ref="{{ barRef }}" style="height:100%;width:0;background:#C8935A"></div></div>

<div ref="{{ hintRef }}" style="position:absolute;right:clamp(14px,2.4vw,32px);bottom:clamp(24px,5vh,52px);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.2em;color:#E4E2D0;pointer-events:none">SCROLL<span style="width:22px;height:34px;border:1.5px solid #E4E2D0;border-radius:999px;display:flex;justify-content:center;padding-top:6px;box-sizing:border-box"><span style="width:3px;height:7px;border-radius:2px;background:#C8935A;animation:hbc-nudge 1.6s ease-in-out infinite"></span></span></div>

</div>
</div>
</section>

<section style="padding:96px clamp(24px,5vw,72px);display:flex;flex-direction:column;gap:12px;align-items:flex-start">
<div style="font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#A8703A">Next section</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:.9">Best sellers</div>
<a href="#" onClick="{{ toTop }}" style="font-weight:800;color:#23261A;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#C8935A;text-decoration-thickness:2px">Replay the hero ↑</a>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cart: 0, idx: 0 };
  data = [
    { word: 'NO HANGOVER', name: 'Mocktail Creator · 100mg', eyebrow: 'Mocktail Creator', tagline: 'Make any drink a cannabis beverage.', desc: 'Tasteless, water-soluble liquid THC. You feel it in about 15 minutes.', price: '$28.95', was: '', detail: '100mg · 20 servings', img: 'assets/cutout/mocktail-100mg.png', imgH: '86%', disc: '#FAF6EE', glow: [142, 158, 79] },
    { word: 'DRINK HEALTHIER', name: 'Rosé · 50mg Liquid THC', eyebrow: 'Non-alcoholic wine', tagline: 'Alcohol removed. Magic added.', desc: 'Half the calories of wine, all the unwind, and no wine head the next morning.', price: '$28.98', was: '', detail: '750mL · 50mg THC cap', img: 'assets/cutout/rose-thc.png', imgH: '100%', disc: '#FBEDE6', glow: [232, 169, 148] },
    { word: 'POUR THE MAGIC', name: 'Chardonnay · 50mg Liquid THC', eyebrow: 'Non-alcoholic wine', tagline: 'Crisp, golden and buzz-ready.', desc: 'Alcohol-removed Chardonnay with a pre-measured cap. Dose it your way.', price: '$28.98', was: '', detail: '750mL · 50mg THC cap', img: 'assets/cutout/chardonnay-thc.png', imgH: '100%', disc: '#FBF3E0', glow: [217, 180, 94] },
    { word: 'PARTY READY', name: 'MaryRita · Party 4 Pack', eyebrow: 'Limited offer · −39%', tagline: 'Four shots of good vibes.', desc: 'Liquid THC shots made for margaritas and alcohol-free wine.', price: '$19.99', was: '$32.99', detail: '4 × 50mg', img: 'assets/cutout/maryrita-4pack.png', imgH: '76%', disc: '#FBF3EA', glow: [200, 147, 90] },
    { word: 'RECOVER BETTER', name: 're:LEAF Muscle Support', eyebrow: 'Wellness', tagline: 'Hemp for the morning after the game.', desc: 'Muscle and recovery support from hemp, made for pickleball people and weekend warriors.', price: '$28.95', was: '', detail: 'Muscle & recovery', img: 'assets/cutout/releaf.png', imgH: '74%', disc: '#F3F5EA', glow: [174, 189, 127] }
  ];
  els = { word: [], prod: [], copy: [], info: [], dot: [] };
  cur = 0;
  refs = null;
  mkRefs() {
    if (this.refs) return this.refs;
    const n = this.data.length, r = { track: el => this.track = el, glow: el => this.glow = el, bar: el => this.bar = el, hint: el => this.hint = el, items: [] };
    for (let i = 0; i < n; i++) r.items.push({ word: el => this.els.word[i] = el, prod: el => this.els.prod[i] = el, copy: el => this.els.copy[i] = el, info: el => this.els.info[i] = el, dot: el => this.els.dot[i] = el });
    return this.refs = r;
  }
  componentDidMount() {
    this.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = () => { this.frame(); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  target() {
    if (!this.track) return 0;
    const r = this.track.getBoundingClientRect(), span = r.height - window.innerHeight;
    return Math.min(1, Math.max(0, -r.top / (span || 1)));
  }
  frame() {
    const t = this.target();
    this.cur += (t - this.cur) * (this.reduce ? 1 : 0.075);
    if (Math.abs(t - this.cur) < 0.0002) this.cur = t;
    const n = this.data.length, p = this.cur * (n - 1);
    const W = this.track ? this.track.clientWidth : window.innerWidth;
    for (let i = 0; i < n; i++) {
      const d = i - p, ad = Math.abs(d), c = Math.min(ad, 1);
      const prod = this.els.prod[i];
      if (prod) {
        const e = Math.min(ad * 1.7, 1), ease = 1 - Math.pow(1 - e, 3);
        const x = d * W * 0.22, y = ease * 50, rot = d * -10, s = 1 - ease * 0.14;
        prod.style.transform = `translate(-50%,-50%) translate3d(${x}px,${y}px,0) rotate(${rot}deg) scale(${s})`;
        prod.style.opacity = Math.max(0, 1 - ad * 2.2).toFixed(3);
        prod.style.filter = 'none';
        prod.style.visibility = ad > 0.6 ? 'hidden' : 'visible';
        prod.style.zIndex = String(100 - Math.round(ad * 10));
      }
      const w = this.els.word[i];
      if (w) { w.style.transform = `translateY(-50%) translate3d(${-d * W * 0.45}px,0,0)`; w.style.opacity = Math.max(0, 1 - ad * 1.5).toFixed(3); }
      const fade = Math.max(0, 1 - ad * 2.4).toFixed(3);
      const cp = this.els.copy[i]; if (cp) { cp.style.opacity = fade; cp.style.transform = `translate3d(0,${d * 40}px,0)`; cp.style.pointerEvents = ad < .3 ? 'auto' : 'none'; }
      const inf = this.els.info[i]; if (inf) { inf.style.opacity = fade; inf.style.transform = `translate3d(0,${d * 36}px,0)`; }
      const dot = this.els.dot[i]; if (dot) { const on = ad < .5; dot.style.height = on ? '28px' : '8px'; dot.style.opacity = on ? '1' : '.35'; dot.style.background = on ? '#C8935A' : '#FAF6EE'; }
    }
    if (this.glow) {
      const a = Math.floor(p), b = Math.min(n - 1, a + 1), f = p - a, A = this.data[a].glow, B = this.data[b].glow;
      const m = A.map((v, k) => Math.round(v + (B[k] - v) * f));
      this.glow.style.background = `radial-gradient(70% 90% at 50% 48%,rgb(${m.join(',')}) 0%,rgba(28,31,20,0) 70%)`;
    }
    if (this.bar) this.bar.style.width = (this.cur * 100).toFixed(2) + '%';
    if (this.hint) this.hint.style.opacity = Math.max(0, 1 - this.cur * 10).toFixed(3);
    const idx = Math.round(p);
    if (idx !== this.state.idx) this.setState({ idx });
  }
  goTo(i) {
    if (!this.track) return;
    const n = this.data.length, span = this.track.offsetHeight - window.innerHeight;
    window.scrollTo({ top: this.track.offsetTop + span * (i / (n - 1)), behavior: 'smooth' });
  }
  renderVals() {
    const r = this.mkRefs(), n = this.data.length;
    return {
      trackRef: r.track, glowRef: r.glow, barRef: r.bar, hintRef: r.hint,
      items: this.data.map((d, i) => ({ ...d, num: String(i + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'), stroke: 'rgba(200,147,90,.5)', solid: 'rgba(200,147,90,.92)', imgEl: React.createElement('img', { src: d.img, alt: d.name, style: { position: 'relative', height: d.imgH, maxWidth: '100%', objectFit: 'contain', filter: 'drop-shadow(0 40px 36px rgba(0,0,0,.5))' } }), initOp: i === 0 ? 1 : 0, wordRef: r.items[i].word, prodRef: r.items[i].prod, copyRef: r.items[i].copy, infoRef: r.items[i].info, dotRef: r.items[i].dot, go: () => this.goTo(i) })),
      addLabel: this.state.cart ? 'Added · ' + this.state.cart + ' in cart' : 'Add to cart · ' + this.data[this.state.idx].price,
      addCurrent: () => this.setState(s => ({ cart: s.cart + 1 })),
      toTop: e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    };
  }
}
</script>
</body>
</html>
